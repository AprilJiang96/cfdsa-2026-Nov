volumes:
  db-data:

networks:
  mynet:
    name: mynet

services:
  mydb:
    image: stackupiss/northwind-db:v1
    environment:
      MYSQL_ROOT_PASSWORD: changeit
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - mynet

  myapp:
    image: stackupiss/northwind-app:v1
    networks:
      - mynet
    ports:
      - "8080:3000"
    environment:
      DB_HOST: mydb
      DB_USER: root
      DB_PASSWORD: changeit