---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bggapp-deploy
  namespace: bggns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bggapp
  template:
    metadata:
      labels:
        app: bggapp
    spec:
      containers:
        - name: bggapp-container
          image: stackupiss/bgg-backend:v1
          imagePullPolicy: IfNotPresent
          envFrom:
          - configMapRef:
              name: bgg-config
          - secretRef:
              name: bgg-secret
          ports:
          - name: bggapp-port
            containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: bggapp-port
            failureThreshold: 3
            initialDelaySeconds: 5
            timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: bggapp-svc
  namespace: bggns
spec:
  type: LoadBalancer
  selector:
    app: bggapp
  ports:
  - port: 3000
    targetPort: bggapp-port