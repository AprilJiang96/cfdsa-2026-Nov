---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umamiapp-deploy
  namespace: workshop03
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: umamiapp
  template:
    metadata:
      labels:
        app: umamiapp
    spec:
      containers:
        - name: umamiapp
          image: ghcr.io/umami-software/umami:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: umamidb-secret
          env:
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@umamidb-svc:5432/$(POSTGRES_DB)
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: umamiapp-secret
                  key: APP_SECRET
          ports:
            - name: umamiapp-port
              containerPort: 3000
          # allows 5 mins for the app to start up and get ready to serve requests
          startupProbe:
            httpGet:
              path: /api/heartbeat
              port: umamiapp-port
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: umamiapp-port
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            # lower bound
            requests:
              cpu: 100m
              memory: 256Mi
            # upper bound
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: umamiapp-svc
  namespace: workshop03
spec:
  selector:
    app: umamiapp
  ports:
    - port: 3000
      targetPort: umamiapp-port

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: umamiapp-httproute
  namespace: workshop03
spec:
  hostnames:
    - 'umami.172.25.0.4.nip.io'
  parentRefs:
    - name: default-gateway
      namespace: default
      port: 80
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: umamiapp-svc
          namespace: workshop03
          port: 3000

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: umamiapp-hpa
  namespace: workshop03
spec:
  minReplicas: 1
  maxReplicas: 4
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: umamiapp-deploy
  metrics:
    - type: Resource
      resource:
       # when CPU utilization exceeds 80%, the HPA will scale up the number of replicas
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80