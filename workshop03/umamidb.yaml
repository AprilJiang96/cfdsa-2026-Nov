---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: umamidb-pvc
  namespace: workshop03
spec:
  accessModes:
    - ReadWriteOncePod
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umamidb-deploy
  namespace: workshop03
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: umamidb
  template:
    metadata:
      labels:
        app: umamidb
    spec:
      volumes:
        - name: umamidb-vol
          persistentVolumeClaim:
            claimName: umamidb-pvc
      containers:
        - name: umamidb
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: umamidb-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: umamidb-port
              containerPort: 5432
          volumeMounts:
            - name: umamidb-vol
              mountPath: /var/lib/postgresql/data
          resources: {}

---
apiVersion: v1
kind: Service
metadata:
  name: umamidb-svc
  namespace: workshop03
spec:
  type: ClusterIP
  selector:
    app: umamidb
  ports:
    - port: 5432
      targetPort: umamidb-port