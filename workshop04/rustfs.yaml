---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-hsvc 
  namespace: workshop04
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: rustfs
    env: workshop
  ports:
  - name: s3
    port: 9000
    targetPort: s3
  - name: console
    port: 9001
    targetPort: console

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs-deploy
  namespace: workshop04
spec:
  serviceName: rustfs-hsvc
  podManagementPolicy: Parallel
  replicas: 3
  volumeClaimTemplates:
  - metadata:
      name: data-vol
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
      storageClassName: standard
  selector:
    matchLabels:
      &pod-labels
      app: rustfs
      env: workshop
  template:
    metadata:
      labels:
        <<: *pod-labels
    spec:
      securityContext:
        fsGroup: 10001
      containers:
      - name: rustfs-container
        image: rustfs/rustfs:1.0.6
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: data-vol
          mountPath: /datal
        envFrom:
        - secretRef:
            name: rustfs-secret
        - configMapRef:
            name: rustfs-cm
        ports:
        - name: s3
          containerPort: 9000
        - name: console
          containerPort: 9001
        resources:
          requests:
            cpu: 200m
            memory: 250Mi
          limits:
            cpu: 500m
            memory: 500Mi

---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-svc 
  namespace: workshop04
spec:
  publishNotReadyAddresses: true
  selector:
    app: rustfs
    env: workshop
  ports:
  - name: api-port
    port: 9000
    targetPort: s3
  - name: console-port
    port: 9001
    targetPort: console

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-httproute
  namespace: workshop04
spec:
  hostnames:
  - data.172.25.0.4.nip.io
  - console.172.25.0.4.nip.io
  parentRefs:
    - name: default-gateway
      namespace: default
      port: 80
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
          - type: Exact 
            name: Host
            value: "data.172.25.0.4.nip.io"
      backendRefs:
        - name: rustfs-svc
          namespace: workshop04
          port: 9000
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
          - type: Exact 
            name: Host
            value: "console.172.25.0.4.nip.io"
      backendRefs:
        - name: rustfs-svc
          namespace: workshop04
          port: 9001
